<div class="personal-slideshow" role="region" aria-roledescription="carousel" aria-label="{{ include.title | escape }} photos" tabindex="0">
  <div class="personal-slideshow-layout">
    <div class="personal-slides">
      {% for slide in include.slides %}
      <figure class="personal-slide" role="group" aria-roledescription="slide" aria-label="{{ forloop.index }} of {{ include.slides.size }}" {% unless forloop.first %}hidden{% endunless %}>
        {% if slide.image %}
        <img src="{{ slide.image | relative_url }}" alt="{{ slide.alt | default: include.title | escape }}" loading="{% if forloop.first %}eager{% else %}lazy{% endif %}">
        {% else %}
        <div class="personal-photo-placeholder" aria-label="Photo coming soon"><span>{{ slide.placeholder }}</span><span>Room for a memory.</span></div>
        {% endif %}
      </figure>
      {% endfor %}
      {% if include.slides.size > 1 %}
      <div class="personal-slide-bars" role="tablist" aria-label="Choose a photo">
        {% for slide in include.slides %}<button type="button" role="tab" data-slide="{{ forloop.index0 }}" aria-label="Show photo {{ forloop.index }}" aria-selected="{% if forloop.first %}true{% else %}false{% endif %}"><span></span></button>{% endfor %}
      </div>
      {% endif %}
    </div>
    <div class="personal-slide-caption">
      <h2 id="heading-{{ include.title | slugify }}">{{ include.title }}</h2>
      {% if include.caption %}<p>{{ include.caption }}</p>{% endif %}
    </div>
  </div>
</div>
