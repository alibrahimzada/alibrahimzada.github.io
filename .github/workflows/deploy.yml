name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

# Serialize deployments so concurrent pushes cannot race each other.
concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'site' }}
  cancel-in-progress: false

env:
  RUBYOPT: -EUTF-8

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Setup Ruby
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2.2'
    - name: Enable bundler cache
      uses: actions/cache@v4
      with:
        path: vendor/bundle
        key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
        restore-keys: |
          ${{ runner.os }}-gems-
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libmagickwand-dev imagemagick
    - name: Install deps
      run: |
        gem install rubygems-update -v 3.4.10
        gem install bundler
        rm -rf ~/.gem
        bundle config path vendor/bundle
        bundle install --jobs 4 --retry 3
        npm install -g mermaid.cli
    - name: Setup deploy options
      id: setup
      env:
        SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        echo "SRC_BRANCH=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
        echo "DEPLOY_BRANCH=gh-pages" >> "$GITHUB_OUTPUT"

    - name: Deploy website
      env:
        SOURCE_BRANCH: ${{ steps.setup.outputs.SRC_BRANCH }}
        DEPLOY_BRANCH: ${{ steps.setup.outputs.DEPLOY_BRANCH }}
      run: |
        options=()
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          options+=(--no-push)
        fi
        bin/deploy --verbose "${options[@]}" --src "$SOURCE_BRANCH" --deploy "$DEPLOY_BRANCH" <<< "yes"

    # GITHUB_TOKEN pushes do not trigger another workflow, so request the
    # branch-based Pages build explicitly after publishing gh-pages.
    - name: Request GitHub Pages build
      if: github.event_name != 'pull_request'
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
